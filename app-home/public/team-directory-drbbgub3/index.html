<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Elite Stone Who to Call</title>
<link rel="manifest" href="/team-directory-drbbgub3/manifest.webmanifest">

<link rel="apple-touch-icon" href="/team-directory-drbbgub3/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Who to Call">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sticky branded header with search, two views (topics, everyone), cards on a calm grey ground */
:root{
  --bg:#f3f3f4; --surface:#ffffff; --ink:#1d1d20; --muted:#6a6b72; --line:#dfe0e3;
  --red:#b22a2a; --red-ink:#ffffff; --chip:#e9e9ec; --focus:#1a5fd1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1e1f22; --ink:#ececee; --muted:#9a9ba3; --line:#323338;
  --red:#d9605e; --red-ink:#141416; --chip:#2a2b2f; --focus:#7fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1e1f22; --ink:#ececee; --muted:#9a9ba3; --line:#323338;
  --red:#d9605e; --red-ink:#141416; --chip:#2a2b2f; --focus:#7fb0ff; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--body);
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
header{padding-block:18px 14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.logo{background:#fff;border-radius:6px;padding:4px 8px;display:flex}
.logo img{height:44px;width:auto;display:block}
h1{font:700 34px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.bar{display:flex;flex-direction:column;gap:12px;padding-bottom:14px;border-bottom:3px solid var(--red)}
.search{display:flex}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.search input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab,.chip{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{padding:6px 12px;font-weight:500;background:var(--chip);border-color:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.branches{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.bh{font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.bc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px 16px;display:grid;gap:2px;min-width:0}
.bc .loc{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:14px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{overflow-wrap:anywhere;font:700 21px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.card .blurb{color:var(--muted);font-size:13px;margin:4px 0 10px}
.p{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:2px;min-width:0}
.p:first-of-type{border-top:0}
.pn{font-weight:600}
.q{color:var(--muted);font-size:13px}
.ct{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14px}
a{color:var(--ink);text-decoration-color:var(--red);text-underline-offset:3px;overflow-wrap:anywhere}
a.ph{font-weight:600;font-variant-numeric:tabular-nums}
.list{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(180px,1.4fr) 140px minmax(200px,1.6fr);gap:4px 16px;padding:11px 16px;border-top:1px solid var(--line);align-items:baseline}
.row:first-child{border-top:0}
.row .t{color:var(--muted);font-size:14px}
.head{background:var(--ink);color:var(--bg);font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em}
.gl{padding:8px 16px;background:var(--chip);font:700 14px var(--display);letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--line)}
.empty{padding:40px 8px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin-top:22px}

.card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.card:hover{border-color:var(--red)}
.card .prev{color:var(--ink);font-size:14px;margin-bottom:12px}
.card .open{margin-top:auto;font-weight:600;color:var(--red);font-size:14px}
#ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(10,10,12,.55)}
#ov[hidden]{display:none}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:min(88vh,720px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 18px 0 20px}
.dh h2{font:700 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.x{font:400 28px/1 var(--body);background:var(--chip);color:var(--ink);border:0;border-radius:50%;width:38px;height:38px;flex:none;cursor:pointer}
#ov .blurb{padding:0 20px;margin:4px 0 8px;color:var(--muted);font-size:14px}
#dp{padding:0 20px 18px}
.mp{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:3px}
.mc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:6px}
a.call{display:inline-block;background:var(--red);color:var(--red-ink);font-weight:600;text-decoration:none;padding:10px 16px;border-radius:8px;font-variant-numeric:tabular-nums}
a.em{font-size:14px}
.results{grid-column:1/-1}
.rh{font:700 14px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:12px;margin-bottom:18px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:3px;align-content:start;min-width:0}
.res .mc{margin-top:8px}
a.add{display:inline-block;justify-self:start;align-self:start;margin-top:10px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--chip)}
a.add.sm{margin-top:4px;padding:3px 8px;font-size:12px;font-weight:500}
a.add:hover{border-color:var(--red)}
a.saveall{text-decoration:none;margin-left:auto;background:var(--chip);border-color:transparent}
@media (max-width:720px){
  .row{grid-template-columns:1fr;padding:12px 16px}
  .head{display:none}
  h1{font-size:30px}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--red)}}
</style>
</head><body>

const $ = id => document.getElementById(id);
const norm = s => (s || "").toLowerCase();
let lastFocus=null, view = "who", group = "All", term = "";

function el(tag, cls, text){const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
function phoneLink(p){ if(!p) return null; const a=el("a","ph",p); a.href="tel:"+p.replace(/\D/g,""); return a; }
function mailLink(m){ if(!m) return null; const a=el("a","",m); a.href="mailto:"+m; return a; }
function hay(p){ return norm([p.name,p.title,p.qual,p.exp,p.group].join(" ")); }

function openTopic(tp){
  $("dt").textContent=tp.title; $("db").textContent=tp.blurb;
  const box=$("dp"); box.replaceChildren();
  for(const p of tp.people){
    const d=el("div","mp"); d.appendChild(el("div","pn",p.name));
    if(p.qual) d.appendChild(el("div","q",p.qual));

    const m=mailLink(p.email); if(m){ m.className="em"; ct.appendChild(m); }
    d.appendChild(ct); const ad=addLink(p); if(ad) d.appendChild(ad); box.appendChild(d);
  }
  lastFocus=document.activeElement; $("ov").hidden=false; $("dlg").scrollTop=0; $("dx").focus();
}
function closeTopic(){ $("ov").hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }

const STOP=new Set(["a","an","the","my","me","i","to","for","with","of","on","in","at","and","or","need","needs","who","whom","call","about","is","are","do","does","how","can","get","want","someone","person","please","help"]);
const GROUPS_SYN=[
 ["trouble","problem","issue","broken","fix","repair","help","support"],
 ["computer","laptop","pc","tech","technology","it"],
 ["quote","estimate","pricing","price","bid"],
 ["pay","payment","bill","invoice","billing","money"],
 ["hire","hiring","job","employment","hr"],
 ["warranty","claim","complaint"],
 ["install","installer","installation","crew"],
 ["partner","partnership"],
 ["sell","sale","salesperson"]
];
function stem(w){
  w=(w||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(w.length>4&&w.endsWith("ies")) return w.slice(0,-3)+"y";
  if(w.length>5&&w.endsWith("ing")) return w.slice(0,-3);
  if(w.length>3&&w.endsWith("s")&&!w.endsWith("ss")) return w.slice(0,-1);
  return w;
}
const SYN={};
for(const g of GROUPS_SYN){ const s=g.map(stem); for(const w of s) SYN[w]=s.filter(x=>x!==w); }
const VCARDS = true;
function slugOf(n){ return n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function addLink(p,cls){ if(!VCARDS) return null; const a=el("a",cls||"add","Add to contacts"); a.href="vcards/"+slugOf(p.name)+".vcf"; return a; }
function wordsOf(s){ return (s||"").split(/[^A-Za-z0-9]+/).map(stem).filter(Boolean); }
function indexPerson(p){
  if(p._ix) return p._ix;
  return p._ix={ name:wordsOf(p.name), tags:wordsOf(p.tags), title:wordsOf(p.title), text:wordsOf((p.exp||"")+" "+(p.group||"")) };
}
function wordScore(tok,w,exact){
  if(w===tok) return exact;
  if((tok.length>=4&&w.startsWith(tok))||(w.length>=5&&tok.startsWith(w))) return 1.5;
  return 0;
}
function scorePerson(toks,p){
  const ix=indexPerson(p); let total=0;
  for(const tok of toks){
    let best=0;
    for(const alt of [tok].concat(SYN[tok]||[])){
      const d=alt===tok?1:0.8;
      for(const [f,v] of [["name",6],["tags",5],["title",4],["text",3]])
        for(const w of ix[f]) best=Math.max(best,d*wordScore(alt,w,v));
    }
    if(best===0) return 0;
    total+=best;
  }
  return total;
}
function queryTokens(q){ return (q||"").split(/\s+/).map(stem).filter(w=>w&&!STOP.has(w)); }
function ranked(q){
  const toks=queryTokens(q); if(!toks.length) return null;
  const out=[]; for(const p of DATA.people){ const s=scorePerson(toks,p); if(s>0) out.push({s,p}); }
  out.sort((a,b)=>b.s-a.s); return out;
}
function resultCard(p){
  const c=el("div","res"); c.appendChild(el("div","pn",p.name)); c.appendChild(el("div","q",p.title));
  if(p.exp) c.appendChild(el("div","q",p.exp));
  const ct=el("div","mc");
  if(p.phone){ const a=el("a","call","Call "+p.phone); a.href="tel:"+p.phone.replace(/\\D/g,""); ct.appendChild(a); }
  const m=mailLink(p.email); if(m){ m.className="em"; ct.appendChild(m); }
  c.appendChild(ct); const ad=addLink(p); if(ad) c.appendChild(ad); return c;
}
function renderResults(box,res){
  const wrap=el("div","results");
  if(!res.length){ wrap.appendChild(el("div","empty","No match. Try a different word, like warranty, template, print or quote.")); box.appendChild(wrap); return; }
  const top=res[0].s, best=res.filter(r=>r.s>=top*0.9), rest=res.filter(r=>r.s<top*0.9);
  wrap.appendChild(el("h3","rh",best.length>1?"Best matches":"Best match"));
  const g1=el("div","rg"); best.forEach(r=>g1.appendChild(resultCard(r.p))); wrap.appendChild(g1);
  if(rest.length){ wrap.appendChild(el("h3","rh","Also related")); const g2=el("div","rg"); rest.forEach(r=>g2.appendChild(resultCard(r.p))); wrap.appendChild(g2); }
  box.appendChild(wrap);
}

    c.appendChild(el("h2","",tp.title)); c.appendChild(el("p","blurb",tp.blurb));
    const names=tp.people.map(p=>p.name.split(" ")[0]);
    const prev=names.length>4?names.slice(0,4).join(", ")+" +"+(names.length-4):names.join(", ");
    c.appendChild(el("div","prev",prev));
    c.appendChild(el("span","open","View "+tp.people.length+(tp.people.length===1?" contact":" contacts")+" \u203a"));
    c.onclick=()=>openTopic(tp);
    g.appendChild(c);
  }
}

function renderBranches(){
  const g=$("bgrid");
  for(const b of DATA.branches){
    const c=el("div","bc"); c.appendChild(el("div","loc",b.branch)); c.appendChild(el("div","pn",b.name));
    c.appendChild(el("div","q",b.qual));
    const ct=el("div","ct"); const a=phoneLink(b.phone), m=mailLink(b.email);
    if(a) ct.appendChild(a); if(m) ct.appendChild(m); c.appendChild(ct); g.appendChild(c);
  }
}
const GROUPS=["All","Leadership","Office & Finance","Sales & PM","Operations","Field Crew","Programming"];
function renderChips(){
  const c=$("chips"); c.replaceChildren();
  for(const gname of GROUPS){
    const b=el("button","chip",gname); b.type="button"; b.setAttribute("aria-pressed", String(group===gname));
    b.onclick=()=>{group=gname; renderChips(); renderAll();}; c.appendChild(b);
  }
}
function renderAll(){
  const l=$("list"); l.replaceChildren(); const res=ranked(term); const keep=res?new Set(res.map(r=>r.p.name)):null;
  const h=el("div","row head"); ["Name","Title","Phone","Email"].forEach(x=>h.appendChild(el("div","",x))); l.appendChild(h);
  let last="", n=0;
  for(const p of DATA.people){
    if(group!=="All" && p.group!==group) continue;
    if(keep && !keep.has(p.name)) continue;
    if(p.group!==last){ l.appendChild(el("div","gl",p.group)); last=p.group; }
    const r=el("div","row"); const nm=el("div"); nm.appendChild(el("div","pn",p.name)); const ad=addLink(p,"add sm"); if(ad) nm.appendChild(ad); r.appendChild(nm); r.appendChild(el("div","t",p.title));
    const ph=el("div"); const a=phoneLink(p.phone); if(a) ph.appendChild(a); r.appendChild(ph);
    const em=el("div"); const m=mailLink(p.email); if(m) em.appendChild(m); r.appendChild(em);
    l.appendChild(r); n++;
  }
  if(!n) l.appendChild(el("div","empty","No match. Try a shorter word."));
}
function setView(v){
  view=v; $("who").hidden=v!=="who"; $("all").hidden=v!=="all";
  $("tab-who").setAttribute("aria-selected",String(v==="who")); $("tab-all").setAttribute("aria-selected",String(v==="all"));
  v==="who"?renderWho():(renderChips(),renderAll());
}
$("dx").onclick=closeTopic;
$("ov").addEventListener("click",e=>{ if(e.target===$("ov")) closeTopic(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("ov").hidden) closeTopic(); });
$("tab-who").onclick=()=>setView("who"); $("tab-all").onclick=()=>setView("all");
$("q").addEventListener("input",e=>{term=e.target.value.trim(); view==="who"?renderWho():renderAll();});
if(VCARDS) $("saveall").hidden=false;
renderBranches();
setView("who");
</script>
</body></html>
